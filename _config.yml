# Editorial working files are public in Git but are not part of the Pages site.
exclude:
  - editorial/
  - AGENTS.md
  - build/
  - vendor/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  # Astro source uses JavaScript front matter. The legacy Pages builder only serves static files.
  - src/pages/
  - src/layouts/
  - src/components/
