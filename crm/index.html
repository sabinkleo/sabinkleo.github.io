<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Área restrita do CRM Vértice Labs.">
<meta property="og:title" content="CRM · Vértice Labs">
<meta property="og:description" content="Área restrita do CRM Vértice Labs.">
<meta property="og:url" content="https://verticelabs.me/crm/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://verticelabs.me/crm/">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.verticelabs.me; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>CRM · Vértice Labs</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./crm.mjs"></script>
</head>
<body>
<main>
<h1>CRM Vértice</h1>
<p id="status" role="status"></p>
<form id="login" hidden>
<label>E-mail <input name="email" type="email" autocomplete="username" required></label>
<label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
<button>Entrar</button>
</form>
<section id="workspace" hidden>
<div class="actions">
<button id="logout">Sair</button>
<button id="export-json">Exportar JSON</button>
<button id="export-csv">Exportar CSV</button>
</div>
<label>Importar leads <input id="import" type="file" accept=".json,.csv"></label>
<label>Buscar lead <input id="search" type="search" placeholder="Empresa, segmento, cidade ou etapa"></label>
<label>Filtrar por etapa <select id="stage-filter"><option value="">Todas</option></select></label>
<p id="revenue" aria-live="polite"></p>
<div class="table-region" tabindex="0" aria-label="Lista de leads">
<table><thead><tr><th>Empresa</th><th>Etapa</th><th>Retorno</th></tr></thead><tbody id="leads"></tbody></table>
</div>
<section id="profile" hidden>
<h2 id="company" tabindex="-1"></h2>
<p id="lead-details"></p>
<div id="contacts" class="actions"></div>
<h3>Evidências</h3><ul id="evidence"></ul>
<h3>Hipóteses comerciais</h3><ul id="hypotheses"></ul>
<form id="pipeline">
<label>Etapa <select name="stage"><option>Prospecção</option><option>Contato feito</option><option>Qualificado</option><option>Proposta</option><option>Ganho</option><option>Perdido</option></select></label>
<label>Próxima ação <input name="nextAction" maxlength="500"></label>
<label>Retorno <input name="followUp" type="date"></label>
<label>Proposta (R$) <input name="proposal" type="number" inputmode="decimal" min="0" step="0.01"></label>
<label>Mensalidade (R$) <input name="monthly" type="number" inputmode="decimal" min="0" step="0.01"></label>
<label>Recebido (R$) <input name="received" type="number" inputmode="decimal" min="0" step="0.01"></label>
<h3>Histórico de contatos</h3><ul id="history"></ul>
<label>Registrar contato <textarea name="note" maxlength="1000"></textarea></label>
<button>Salvar</button>
</form>
</section>
</section>
</main>
</body>
</html>
