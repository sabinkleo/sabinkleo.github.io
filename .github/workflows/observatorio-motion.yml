name: Observatório motion review
on:
  pull_request:
    paths:
      - 'editorial/motion/**'
      - 'editorial/motion_video.py'
      - 'editorial/test_motion_video.py'
      - 'editorial/model.py'
      - 'editorial/schema.json'
      - 'editorial/config.json'
      - 'editorial/requirements.txt'
      - 'editorial/records/**'
      - '.github/workflows/observatorio-motion.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: Approved editorial record slug
        default: github-cli-eventos-pr
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editorial/motion/package-lock.json
      - name: Install review dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install -r editorial/requirements.txt
          npm ci --prefix editorial/motion --ignore-scripts --no-audit --no-fund
      - name: Editorial regression tests
        run: python -m unittest discover -s editorial -t . -p 'test_*.py'
      - name: Render a review bundle
        env:
          SLUG: ${{ inputs.slug || 'github-cli-eventos-pr' }}
        run: |
          args=()
          if command -v google-chrome >/dev/null; then
            args+=(--browser "$(command -v google-chrome)")
          fi
          python -m editorial.motion_video --output build/motion-review "${args[@]}" -- "$SLUG"
      - uses: actions/upload-artifact@v4
        with:
          name: observatorio-motion-review
          path: build/motion-review/
          retention-days: 7
          if-no-files-found: error
