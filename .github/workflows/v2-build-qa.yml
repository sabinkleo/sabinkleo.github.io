name: V2 build QA
on:
  pull_request:
    paths:
      - 'src/**'
      - 'crm/**'
      - 'assets/ai-*.mjs'
      - 'tests/sitewide-ai*'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/v2-build-smoke.mjs'
      - 'tests/technical-diagnostics.mjs'
      - 'tests/interactive-lab-hud.mjs'
      - 'assets/command-hud.*'
      - 'tests/teardown-engine.mjs'
      - 'public/contact-qr.svg'
      - 'infra/triage/**'
      - '.github/workflows/v2-build-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Build PR base and record existing HTML routes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/vertice-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/vertice-base"
          npm ci --no-audit --no-fund
          npm run build
          find dist -type f -name '*.html' | LC_ALL=C sort > "$RUNNER_TEMP/vertice-base-routes"
      - run: node --test tests/sitewide-ai-worker.mjs
      - run: npm run build
      - name: Verify every baseline HTML route
        if: github.event_name == 'pull_request'
        run: |
          find dist -type f -name '*.html' | LC_ALL=C sort > "$RUNNER_TEMP/vertice-pr-routes"
          LC_ALL=C comm -23 "$RUNNER_TEMP/vertice-base-routes" "$RUNNER_TEMP/vertice-pr-routes" > "$RUNNER_TEMP/missing"
          cat "$RUNNER_TEMP/missing"
          test ! -s "$RUNNER_TEMP/missing"
      - run: node tests/v2-build-smoke.mjs
      - name: Exercise the visible diagnostic in runner Chrome
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/technical-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8766/en/ -o /dev/null
          node tests/technical-diagnostics.mjs
          node tests/interactive-lab-hud.mjs
          node tests/teardown-engine.mjs

          npx --no-install playwright test --config tests/sitewide-ai.config.mjs
