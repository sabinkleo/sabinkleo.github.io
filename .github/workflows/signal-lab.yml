name: Public Drops verification
on:
  pull_request:
    paths:
      - "drops/**"
      - "signal-lab/**"
      - "index.html"
      - ".github/workflows/signal-lab.yml"
  push:
    branches: ["main"]
    paths:
      - "drops/**"
      - "signal-lab/**"
      - "index.html"
      - ".github/workflows/signal-lab.yml"
permissions:
  contents: read
jobs:
  validate-public-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public catalog and privacy boundary
        run: python signal-lab/validate.py
      - name: JavaScript syntax
        run: node --check drops/app.js
