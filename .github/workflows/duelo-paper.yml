name: Duelo spot simulado
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/duelo-paper.yml']
  workflow_dispatch:

permissions: {}
concurrency:
  group: duelo-paper-producao
  cancel-in-progress: false

jobs:
  simular:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci --prefix bot --ignore-scripts --no-audit --no-fund
      - name: Atualizar os dois livros
        run: bash bot/measure-paper-run.sh bash bot/paper-runtime.sh
