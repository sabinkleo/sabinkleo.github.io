name: Publish Vértice Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          PUBLIC_TRIAGE_ENDPOINT: ${{ vars.PUBLIC_TRIAGE_ENDPOINT }}
      - run: node tests/v2-build-smoke.mjs
      - run: node tests/catalog-route.mjs
      - name: Combine static routes and publish the bilingual home
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          rsync -a dist/ _site/
          test -s _site/en/teardown/index.html
          test -s _site/en/lab/index.html
          test -s _site/pt/index.html
          grep -q 'lang="en"' _site/index.html
          grep -q 'lang="pt-BR"' _site/pt/index.html
          grep -q 'lang="pt-BR"' _site/pt/catalogo/index.html
          cmp crm/crm.mjs _site/crm/crm.mjs
      - name: Build bilingual Observatory
        run: python3 -m editorial.bilingual --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
      - name: Verify production routes
        run: |
          for route in / /pt/ /pt/catalogo/ /en/ /en/lab /en/teardown /crm/ /observatorio/ /en/observatory/; do
            status=$(curl --retry 4 --retry-all-errors --max-time 20 -sSL -o /dev/null -w '%{http_code}' "https://verticelabs.me$route")
            echo "$route $status"
            test "$status" = 200
          done
  production-browser:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Check whether the deployed gateway serves multi-action requests
        id: edge
        run: |
          url="https://vertice-technical-triage-pages.sabino-fabio.workers.dev/api/ai"
          code=$(curl --max-time 20 -sS -o "$RUNNER_TEMP/ai-probe.json" -w '%{http_code}' -H 'Origin: https://verticelabs.me' -H 'Content-Type: application/json' --data '{"action":"intent","lang":"en","vertical":"ai-ops","entities":[]}' "$url")
          echo "Worker POST /api/ai $code"
          echo "status=$code" >> "$GITHUB_OUTPUT"
      - name: Upgrade the legacy triage-only Pages Worker
        if: steps.edge.outputs.status == '404'
        working-directory: infra/triage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Worker still serves only triage. Cloudflare deployment credential unavailable."
          else
            npx --yes wrangler@4 deploy --env pages
          fi
      - run: node tests/live-pages.mjs
